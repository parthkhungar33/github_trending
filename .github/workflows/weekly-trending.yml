name: GitHub Trending Pulse

on:
  schedule:
    - cron: "30 3 * * 2"    # Every Tuesday 9:00 AM IST (3:30 AM UTC)
  workflow_dispatch:          # Manual trigger from GitHub UI
    inputs:
      force:
        description: "Send even if this week's brief was already sent today"
        type: boolean
        default: false

# Never run two sends at once (e.g. a manual trigger overlapping the cron).
concurrency:
  group: trending-pulse
  cancel-in-progress: false

permissions:
  contents: write             # lets the job commit history.json back to the repo

jobs:
  send-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          # GITHUB_TOKEN is auto-provided by GitHub Actions — no setup needed
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL:   ${{ secrets.OPENROUTER_MODEL }}
          RESEND_API_KEY:     ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL:         ${{ secrets.FROM_EMAIL }}
          TO_EMAIL:           ${{ secrets.TO_EMAIL }}
          READER_CONTEXT:     ${{ secrets.READER_CONTEXT }}   # optional
          FORCE_SEND:         ${{ inputs.force }}
        run: python main.py

      # Commit the updated history so next week knows what was already featured.
      # This weekly commit also keeps the repo "active", so GitHub never auto-disables
      # the schedule after 60 days of no commits (which is what broke it in Sept 2026).
      - name: Save history
        run: |
          if [ -n "$(git status --porcelain history.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history.json
            git commit -m "Record brief for $(date -u +%F)"
            git push
          fi
